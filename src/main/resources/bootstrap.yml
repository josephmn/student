spring:
  application:
    name: student
    version: "@project.version@"
  profiles:
    active: dev
  cloud:
    config:
      uri: ${CONFIG_SERVER:http://localhost:8886}
    vault:
      enabled: true
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: http
      authentication: TOKEN
      token: 00000000-0000-0000-0000-000000000000
      kv:
        enabled: true
        application-name: student
        backend: secret
        version: 2
  output:
    ansi:
      enabled: ALWAYS
